<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- 主渐变：深邃的科技紫蓝 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <!-- 内部光效渐变 -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 1. 实体文档基座 -->
  <path d="M6 4C6 2.89543 6.89543 2 8 2H20L26 8V28C26 29.1046 25.1046 30 24 30H8C6.89543 30 6 29.1046 6 28V4Z" fill="url(#mainGrad)" filter="url(#shadow)"/>
  
  <!-- 2. 文档折角部分 (更厚实) -->
  <path d="M20 2L26 8H21C20.4477 8 20 7.55228 20 7V2Z" fill="#FFFFFF" fill-opacity="0.3"/>
  
  <!-- 3. 数据层级感 (实体线条) -->
  <rect x="10" y="14" width="8" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.5"/>
  <rect x="10" y="18" width="12" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="10" y="22" width="6" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- 4. 核心追踪圆核 (实体球感) -->
  <circle cx="22" cy="22" r="7" fill="#FFFFFF" filter="url(#shadow)"/>
  <circle cx="22" cy="22" r="5" fill="url(#mainGrad)"/>
  
  <!-- 5. 智力星芒 (镂空/实体结合) -->
  <path d="M22 19.5V24.5M19.5 22H24.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M20.5 20.5L23.5 23.5M23.5 20.5L20.5 23.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>

  <!-- 顶部高光，增强实体玻璃感 -->
  <path d="M8 2H24C25.1046 2 26 2.89543 26 4V6H6V4C6 2.89543 6.89543 2 8 2Z" fill="url(#innerGrad)"/>
</svg>
